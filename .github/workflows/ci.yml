name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-not-used-at-runtime-0123456789
      - run: npm audit --omit=dev --audit-level=high

  postgres:
    name: Migrate + seed real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sbp
          POSTGRES_PASSWORD: sbp
          POSTGRES_DB: sportbootspro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sbp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sbp:sbp@localhost:5432/sportbootspro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password-123
      - name: Seeding twice is safe
        run: npm run db:seed
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password-123
      - name: Data is there
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from products')" = "17"
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from admins')" = "1"
